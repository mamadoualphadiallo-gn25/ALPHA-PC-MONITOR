name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name ALPHA-PC-MONITOR packaging/alpha_pc_monitor.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ALPHA-PC-MONITOR-Windows
          path: dist/ALPHA-PC-MONITOR/
